appId: com.bjoernf.pdf-interpolator
productName: PDF Interpolator

directories:
  output: release
  buildResources: build

files:
  - 'out/**/*'

asarUnpack:
  - resources/**

win:
  executableName: PDF Interpolator
  target:
    - nsis

nsis:
  shortcutName: PDF Interpolator
  uninstallDisplayName: PDF Interpolator

mac:
  artifactName: PDF-Interpolator-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: true
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.

afterSign: scripts/notarize.js

dmg:
  artifactName: PDF-Interpolator-${version}-${arch}.${ext}
  iconSize: 160
  iconTextSize: 12
  window:
    width: 660
    height: 400
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications

linux:
  artifactName: PDF-Interpolator-${version}-${os}-${arch}.${ext}
  target:
    - AppImage
    - snap
    - deb
  maintainer: "bjoernf.com"
  category: Utility

appImage:
  artifactName: ${name}-${version}-${arch}.${ext}

npmRebuild: false

snap:
  publish:
    - github

publish:
  provider: github
  owner: itsbjoern
  repo: pdf-interpolator
  releaseType: release

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
